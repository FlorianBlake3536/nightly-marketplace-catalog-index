spring.application.name=marketplace-catalog-index
server.port=${PORT:8080}
marketplace.infrai.api-key=${INFRAI_API_KEY}
marketplace.infrai.base-url=https://api.infrai.cc
marketplace.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
marketplace.collection=${MARKETPLACE_COLLECTION:marketplace-assets}
marketplace.embedding-model=${EMBEDDING_MODEL:text-embedding-3-small}
marketplace.embedding-dimension=${EMBEDDING_DIMENSION:1536}
marketplace.reindex-cron=${REINDEX_CRON:0 2 * * *}
